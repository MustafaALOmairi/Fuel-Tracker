<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fuel Tracker | Fuel Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Fuel Tracker</h2>

    <nav>
      <a class="active" href="index.html">⛽ Fuel Entry</a>
      <a href="management.html">🛠 Management</a>
      <a href="reports.html">📊 Reports</a>
    </nav>

    <button id="langBtn">AR</button>
  </aside>

  <!-- Main -->
  <main class="content">
    <h1 data-en="Fuel Entry" data-ar="تسجيل تعبئة الوقود">Fuel Entry</h1>

    <div class="card">
      <label data-en="Equipment" data-ar="المعدة"></label>
      <select id="equipment"></select>

      <label data-en="Operator" data-ar="المشغل"></label>
      <select id="operator"></select>

      <label data-en="Fuel Quantity (Liters)" data-ar="كمية الوقود (لتر)"></label>
      <input id="liters" type="number" placeholder="0">

      <label data-en="Notes" data-ar="ملاحظات"></label>
      <textarea id="notes"></textarea>

      <button onclick="saveFuel()" data-en="Save Entry" data-ar="حفظ"></button>
    </div>

    <pre id="result"></pre>
  </main>
</div>

<script src="js/fuel.js"></script>
</body>
</html>
