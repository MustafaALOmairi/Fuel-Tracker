<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fuel Tracker | Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Fuel Tracker</h2>

    <nav>
      <a href="index.html">⛽ Fuel Entry</a>
      <a href="management.html">🛠 Management</a>
      <a class="active" href="reports.html">📊 Reports</a>
    </nav>

    <button id="langBtn">AR</button>
  </aside>

  <!-- Content -->
  <main class="content">
    <h1 data-en="Reports" data-ar="التقارير">Reports</h1>

    <!-- Summary Cards -->
    <div class="stats">
      <div class="stat-card">
        <h3 data-en="Total Consumption" data-ar="إجمالي الاستهلاك"></h3>
        <p id="totalLiters">0</p>
      </div>

      <div class="stat-card">
        <h3 data-en="Total Entries" data-ar="عدد التعبئات"></h3>
        <p id="totalEntries">0</p>
      </div>
    </div>

    <!-- Table -->
    <div class="card" style="max-width:100%;">
      <h3 data-en="Fuel Entries" data-ar="سجلات الوقود"></h3>

      <table id="fuelTable">
        <thead>
          <tr>
            <th data-en="Date" data-ar="التاريخ"></th>
            <th data-en="Equipment" data-ar="المعدة"></th>
            <th data-en="Operator" data-ar="المشغل"></th>
            <th data-en="Liters" data-ar="اللترات"></th>
            <th data-en="Notes" data-ar="ملاحظات"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/reports.js"></script>
</body>
</html>
